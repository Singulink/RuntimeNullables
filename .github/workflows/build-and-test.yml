name: build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# Auto-cancel any old in-progress runs for the same PR, but not for non-PR runs
concurrency:
  group: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    # Windows only: the IL snapshot and strong name tests use Windows SDK tools (ildasm, sn). The end-to-end tests also build with the image's Visual
    # Studio, using the newest .NET SDK it supports among the image's preinstalled ones.
    runs-on: windows-latest
    name: test-windows-x64-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # The tests run on .NET 6, 10 and 11 (11 for runtime async), and the end-to-end tests on .NET 10 (they build with the newest SDK, currently 11).
        # Building the repository needs the .NET 11 SDK.
        dotnet-version: |
          6.0.x
          10.0.x
    - name: Setup .NET 11
      uses: actions/setup-dotnet@v5
      with:
        # Prerelease until .NET 11 is released; then this can move to the list above.
        dotnet-version: 11.0.x
        dotnet-quality: preview
    - name: Clean
      run: dotnet clean RuntimeNullables.slnx --configuration ${{ matrix.configuration }} && dotnet nuget locals all --clear
    - name: Install dependencies
      run: dotnet restore RuntimeNullables.slnx
    - name: Build
      run: dotnet build RuntimeNullables.slnx --configuration ${{ matrix.configuration }} --no-restore
    - name: Test
      run: dotnet test RuntimeNullables.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal

  end-to-end-tests-linux:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    # The end-to-end tests build projects with the package like its users do, many of whom build on Linux.
    runs-on: ubuntu-latest
    name: end-to-end-linux-x64-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        # The end-to-end tests run on .NET 10 and build with the newest SDK, currently 11.
        dotnet-version: 10.0.x
    - name: Setup .NET 11
      uses: actions/setup-dotnet@v5
      with:
        # Prerelease until .NET 11 is released; then this can move to the list above.
        dotnet-version: 11.0.x
        dotnet-quality: preview
    - name: Test
      run: dotnet test Tests/RuntimeNullables.EndToEndTests --configuration ${{ matrix.configuration }} --verbosity normal
